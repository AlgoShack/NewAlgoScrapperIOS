<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; img-src 'self' data: file:;">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #141820;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .popup {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1e2634 0%, #12161f 100%);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-app-region: drag;
  }

  .header {
    height: 40px;
    padding: 0 12px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 20, 29, 0.55);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
    cursor: move;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    height: 22px;
  }

  .brand-logo {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: #ffffff;
    line-height: 20px;
    white-space: nowrap;
  }

  .brand-pill {
    display: inline-flex;
    align-items: center;
    height: 20px;
    background: rgba(47, 139, 204, 0.14);
    border: 1px solid rgba(47, 139, 204, 0.3);
    color: #38bdf8;
    font-size: 10px;
    font-weight: 600;
    padding: 0 8px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    line-height: 1;
    white-space: nowrap;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 22px;
    flex-shrink: 0;
  }

  .cancel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    outline: none;
    padding: 0;
  }

  .cancel-btn:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.4);
    color: #f87171;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px 24px 18px;
    text-align: center;
    min-height: 0;
  }

  .content-stack {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .loader-container {
    position: relative;
    width: 42px;
    height: 42px;
    margin: 0 0 10px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .loader-image {
    width: 40px;
    height: 40px;
    object-fit: contain;
    -webkit-user-drag: none;
    z-index: 2;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.08);
    border-top-color: #38bdf8;
    border-right-color: rgba(56, 189, 248, 0.35);
    animation: spin 0.85s linear infinite;
    z-index: 2;
  }

  .spinner.hidden,
  .loader-image.hidden { display: none; }

  .check {
    display: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    place-items: center;
    background: rgba(34, 197, 94, 0.15);
    border: 1.5px solid rgba(34, 197, 94, 0.45);
    color: #4ade80;
    font-size: 16px;
    font-weight: 700;
    z-index: 2;
  }
  .check.show { display: grid; }

  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    color: #f8fafc;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 0 0 5px;
    width: 100%;
    line-height: 1.25;
    text-align: center;
  }

  .status {
    width: 100%;
    min-height: 17px;
    margin: 0;
    color: #38bdf8;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    text-align: center;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  .status.show {
    opacity: 1;
    transform: translateY(0);
  }

  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }

  .dots {
    display: inline-block;
    width: 1.05em;
    margin-left: 1px;
    overflow: hidden;
    vertical-align: baseline;
    text-align: left;
  }

  .dots::after {
    content: "";
    display: inline-block;
    min-width: 1.05em;
    text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
    100% { content: ""; }
  }

  .bar-container {
    width: 78%;
    max-width: 236px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    overflow: hidden;
    margin: 12px auto 0;
    flex-shrink: 0;
  }

  .bar-container > i {
    display: block;
    height: 100%;
    width: 18%;
    border-radius: inherit;
    background: linear-gradient(90deg, #2F8BCC, #38bdf8);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .first-time-hint {
    display: none;
    margin: 12px 0 0;
    align-items: center;
    justify-content: center;
    gap: 6px;
    max-width: 100%;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: #94a3b8;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.2;
    white-space: nowrap;
  }

  .first-time-hint.show {
    display: inline-flex;
  }

  .first-time-hint svg {
    color: #38bdf8;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="brand-group">
        <img src="icon/algoScraper-logo.png" class="brand-logo" alt="Logo" onerror="this.style.display='none';" />
        <span class="brand-title">AlgoScraper</span>
      </div>
      <div class="header-right">
        <span class="brand-pill">Powered by algoShack</span>
        <button id="cancelStartupBtn" class="cancel-btn" title="Cancel launch" aria-label="Cancel startup">
          <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="content">
      <div class="content-stack">
        <div class="loader-container">
          <img src="icon/load-8510_256.gif" class="loader-image" id="loaderImg" alt=""
               onerror="this.classList.add('hidden'); document.getElementById('spinner').classList.remove('hidden');" />
          <div class="spinner hidden" id="spinner"></div>
          <div class="check" id="checkMark">✓</div>
        </div>

        <h1 id="headline">Preparing AlgoScraper</h1>
        <p class="status show" id="status">Starting<span class="dots"></span></p>

        <div class="bar-container">
          <i id="progressBar"></i>
        </div>

        <div class="first-time-hint" id="firstTimeHint">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>First time loading may take time, please wait...</span>
        </div>
      </div>
    </div>
  </div>

<script>
  let electronIpc = null;
  try {
    electronIpc = require('electron').ipcRenderer;
  } catch (_) {}

  const cancelBtn = document.getElementById("cancelStartupBtn");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (electronIpc) {
        electronIpc.send("cancel-startup");
      } else {
        window.close();
      }
    });
  }

  window.__setFirstLaunchHint = function(show) {
    const hint = document.getElementById("firstTimeHint");
    if (!hint) return;
    if (show) hint.classList.add("show");
    else hint.classList.remove("show");
  };

  (function applyFirstLaunchHint() {
    try {
      const params = new URLSearchParams(window.location.search);
      window.__setFirstLaunchHint(params.get("first") === "1");
    } catch (_) {}
  })();

  const STEP_PROGRESS = { prereq: 18, appium: 55, device: 80, launch: 100 };
  let msgTimer = null;

  function setProgress(step, status) {
    const bar = document.getElementById("progressBar");
    if (!bar) return;
    let pct = STEP_PROGRESS[step] || 20;
    if (status === "active") pct = Math.max(8, pct - 12);
    if (status === "done" && step === "launch") pct = 100;
    bar.style.width = pct + "%";
  }

  function setBusy(isDone) {
    const img = document.getElementById("loaderImg");
    const spinner = document.getElementById("spinner");
    const check = document.getElementById("checkMark");
    if (isDone) {
      if (img) img.classList.add("hidden");
      if (spinner) spinner.classList.add("hidden");
      if (check) check.classList.add("show");
    } else {
      if (img && !img.classList.contains("hidden")) img.classList.remove("hidden");
      if (spinner && img && img.classList.contains("hidden")) spinner.classList.remove("hidden");
      if (check) check.classList.remove("show");
    }
  }

  window.__setStartupUI = function(payload) {
    try {
      const data = typeof payload === "string" ? JSON.parse(payload) : payload;
      const statusEl = document.getElementById("status");
      const headlineEl = document.getElementById("headline");
      const text = data.live || data.detail || "";
      const isDone = data.status === "done";
      const isError = data.status === "error";

      if (data.headline && headlineEl) headlineEl.textContent = data.headline;

      setProgress(data.step, data.status);
      setBusy(data.step === "launch" && isDone);

      if (!statusEl || !text) return;

      if (msgTimer) clearTimeout(msgTimer);
      statusEl.classList.remove("show", "ok", "err");

      msgTimer = setTimeout(function() {
        const showDots = data.status === "active";
        const safeText = String(text)
          .replace(/[\u2713\u2714\u2705\u2611]/g, '')
          .replace(/â[\u0080-\u00FF]{0,3}/g, '')
          .replace(/\s{2,}/g, ' ')
          .trim();
        statusEl.innerHTML = safeText + (showDots ? '<span class="dots"></span>' : '');
        if (isDone) statusEl.classList.add("ok");
        if (isError) statusEl.classList.add("err");
        void statusEl.offsetWidth;
        statusEl.classList.add("show");
      }, 160);
    } catch (e) {
      console.error(e);
    }
  };
</script>
</body>
</html>
